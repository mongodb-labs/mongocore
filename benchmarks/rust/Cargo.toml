[package]
name = "mongocore-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
mongocore = { path = "../.." }
bson = "2"
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["full"] }
tonic = "0.12"

[[bench]]
name = "cache_lookup"
harness = false

[[bench]]
name = "template_matching"
harness = false

[[bench]]
name = "mql_validation"
harness = false

[[bench]]
name = "pipeline"
harness = false
