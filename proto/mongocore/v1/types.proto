syntax = "proto3";
package mongocore.v1;
option go_package = "github.com/rozza/mongocore/clients/go/proto";

// A BSON document represented as raw bytes (avoids double-serialization)
message Document {
  bytes data = 1;
}

message Filter {
  bytes data = 1;  // BSON filter document
}

message Pipeline {
  repeated bytes stages = 1;  // Each stage is a BSON document
}

message FindOptions {
  optional int64 limit = 1;
  optional int64 skip = 2;
  optional bytes sort = 3;       // BSON document
  optional bytes projection = 4; // BSON document
}

message IndexOptions {
  optional string name = 1;
  optional bool unique = 2;
  optional bool sparse = 3;
}

message FindAndModifyOptions {
  enum ReturnDocument {
    BEFORE = 0;
    AFTER = 1;
  }
  ReturnDocument return_document = 1;
  bool upsert = 2;
  optional bytes sort = 3;  // BSON document
}

// Common metadata in responses
message ResponseMetadata {
  string search_method = 1;  // "vector", "fulltext", "compiled_query", ""
}

// Streaming batch of documents (used by FindStream, AggregateStream)
message DocumentBatch {
  repeated Document documents = 1;
  uint32 batch_index = 2;
  bool has_more = 3;
}

// Streaming insert batch (client-to-server)
message InsertBatch {
  string database = 1;
  string collection = 2;
  repeated Document documents = 3;
}

// Per-batch acknowledgment for bidirectional insert
message InsertBatchAck {
  uint32 batch_index = 1;
  uint32 inserted_count = 2;
  repeated InsertError errors = 3;
}

message InsertError {
  uint32 index = 1;
  string message = 2;
  int32 code = 3;
}

// Response for unidirectional streaming insert
message InsertManyStreamResponse {
  uint64 total_inserted = 1;
  repeated InsertError errors = 2;
}
