syntax = "proto3";
package mongocore.v1;
option go_package = "github.com/rozza/mongocore/clients/go/proto";

import "mongocore/v1/types.proto";
import "mongocore/v1/ingestion.proto";

service MongoCore {
  // CRUD
  rpc Find(FindRequest) returns (FindResponse);
  rpc FindOne(FindOneRequest) returns (FindOneResponse);
  rpc Insert(InsertRequest) returns (InsertResponse);
  rpc InsertMany(InsertManyRequest) returns (InsertManyResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc UpdateMany(UpdateManyRequest) returns (UpdateManyResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc DeleteMany(DeleteManyRequest) returns (DeleteManyResponse);
  rpc FindAndModify(FindAndModifyRequest) returns (FindAndModifyResponse);

  // Aggregation
  rpc Aggregate(AggregateRequest) returns (AggregateResponse);

  // Transactions
  rpc BeginTransaction(BeginTransactionRequest) returns (BeginTransactionResponse);
  rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse);
  rpc AbortTransaction(AbortTransactionRequest) returns (AbortTransactionResponse);

  // Admin
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc CreateIndex(CreateIndexRequest) returns (CreateIndexResponse);

  // Introspection
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);

  // Search
  rpc Search(SearchRequest) returns (SearchResponse);

  // Streaming
  rpc Watch(WatchRequest) returns (stream WatchEvent);

  // Streaming bulk operations
  rpc FindStream(FindStreamRequest) returns (stream DocumentBatch);
  rpc AggregateStream(AggregateStreamRequest) returns (stream DocumentBatch);
  rpc InsertManyStream(stream InsertBatch) returns (InsertManyStreamResponse);
  rpc InsertManyBidi(stream InsertBatch) returns (stream InsertBatchAck);

  // Raw Passthrough
  rpc RunCommand(RunCommandRequest) returns (RunCommandResponse);

  // Analytics
  rpc GetAnalytics(GetAnalyticsRequest) returns (GetAnalyticsResponse);

  // Ingestion
  rpc Ingest(IngestRequest) returns (IngestResponse);
  rpc GetIngestStatus(GetIngestStatusRequest) returns (GetIngestStatusResponse);
  rpc ListIngestJobs(ListIngestJobsRequest) returns (ListIngestJobsResponse);
  rpc CancelIngest(CancelIngestRequest) returns (CancelIngestResponse);
  rpc WatchDirectory(WatchDirectoryRequest) returns (WatchDirectoryResponse);
  rpc StopWatch(StopWatchRequest) returns (StopWatchResponse);

  // Pipeline
  rpc Pipeline(PipelineRequest) returns (PipelineResponse);

  // Transaction Pipeline
  rpc TransactionPipeline(TransactionPipelineRequest) returns (TransactionPipelineResponse);
}

// ==================== CRUD Requests/Responses ====================

message FindRequest {
  string database = 1;
  string collection = 2;
  Filter filter = 3;
  FindOptions options = 4;
  optional string transaction_id = 5;
}

message FindResponse {
  repeated Document documents = 1;
  ResponseMetadata metadata = 2;
}

message FindOneRequest {
  string database = 1;
  string collection = 2;
  Filter filter = 3;
  FindOptions options = 4;
  optional string transaction_id = 5;
}

message FindOneResponse {
  optional Document document = 1;
  ResponseMetadata metadata = 2;
}

message InsertRequest {
  string database = 1;
  string collection = 2;
  Document document = 3;
  optional string transaction_id = 4;
}

message InsertResponse {
  string inserted_id = 1;  // Stringified ObjectId or equivalent
}

message InsertManyRequest {
  string database = 1;
  string collection = 2;
  repeated Document documents = 3;
  optional string transaction_id = 4;
}

message InsertManyResponse {
  repeated string inserted_ids = 1;
  int64 inserted_count = 2;
}

message UpdateRequest {
  string database = 1;
  string collection = 2;
  Filter filter = 3;
  Document update = 4;  // BSON update document (e.g. {$set: {...}})
  bool upsert = 5;
  optional string transaction_id = 6;
}

message UpdateResponse {
  int64 matched_count = 1;
  int64 modified_count = 2;
  optional string upserted_id = 3;
}

message UpdateManyRequest {
  string database = 1;
  string collection = 2;
  Filter filter = 3;
  Document update = 4;
  bool upsert = 5;
  optional string transaction_id = 6;
}

message UpdateManyResponse {
  int64 matched_count = 1;
  int64 modified_count = 2;
  optional string upserted_id = 3;
}

message DeleteRequest {
  string database = 1;
  string collection = 2;
  Filter filter = 3;
  optional string transaction_id = 4;
}

message DeleteResponse {
  int64 deleted_count = 1;
}

message DeleteManyRequest {
  string database = 1;
  string collection = 2;
  Filter filter = 3;
  optional string transaction_id = 4;
}

message DeleteManyResponse {
  int64 deleted_count = 1;
}

message FindAndModifyRequest {
  string database = 1;
  string collection = 2;
  Filter filter = 3;
  Document update = 4;
  FindAndModifyOptions options = 5;
  optional string transaction_id = 6;
}

message FindAndModifyResponse {
  optional Document document = 1;  // The document before or after modification
}

// ==================== Aggregation ====================

message AggregateRequest {
  string database = 1;
  string collection = 2;
  Pipeline pipeline = 3;
  optional string transaction_id = 4;
}

message AggregateResponse {
  repeated Document documents = 1;
  ResponseMetadata metadata = 2;
}

// ==================== Transactions ====================

message BeginTransactionRequest {
  string database = 1;
}

message BeginTransactionResponse {
  string transaction_id = 1;
}

message CommitTransactionRequest {
  string transaction_id = 1;
}

message CommitTransactionResponse {}

message AbortTransactionRequest {
  string transaction_id = 1;
}

message AbortTransactionResponse {}

// ==================== Admin ====================

message CreateCollectionRequest {
  string database = 1;
  string collection = 2;
}

message CreateCollectionResponse {}

message CreateIndexRequest {
  string database = 1;
  string collection = 2;
  Document keys = 3;  // BSON document specifying index keys
  IndexOptions options = 4;
}

message CreateIndexResponse {
  string index_name = 1;
}

// ==================== Introspection ====================

message ListDatabasesRequest {}

message ListDatabasesResponse {
  repeated string databases = 1;
}

message ListCollectionsRequest {
  string database = 1;
}

message ListCollectionsResponse {
  repeated string collections = 1;
}

// ==================== Search ====================

message SearchRequest {
  string database = 1;
  string collection = 2;
  string query = 3;
  int64 limit = 4;
}

message SearchResponse {
  repeated Document documents = 1;
  string method = 2;  // "vector", "fulltext", or "filter"
  int64 total = 3;
}

// ==================== Streaming ====================

message WatchRequest {
  string database = 1;
  optional string collection = 2;  // If empty, watch whole database
  Pipeline pipeline = 3;           // Optional aggregation pipeline to filter events
}

message WatchEvent {
  enum OperationType {
    INSERT = 0;
    UPDATE = 1;
    DELETE = 2;
    REPLACE = 3;
    INVALIDATE = 4;
  }
  OperationType operation_type = 1;
  string database = 2;
  string collection = 3;
  optional Document document = 4;       // Full document (for insert/update/replace)
  optional Document update_description = 5; // For update events: {updatedFields, removedFields}
  optional Document document_key = 6;   // The _id of the affected document
}

// ==================== Streaming Bulk ====================

message FindStreamRequest {
  string database = 1;
  string collection = 2;
  Filter filter = 3;
  FindOptions options = 4;
  optional string transaction_id = 5;
  uint32 batch_size = 6;
}

message AggregateStreamRequest {
  string database = 1;
  string collection = 2;
  Pipeline pipeline = 3;
  optional string transaction_id = 4;
  uint32 batch_size = 5;
}

// ==================== Raw Passthrough ====================

message RunCommandRequest {
  string database = 1;
  Document command = 2;
  bool allow_all = 3;
}

message RunCommandResponse {
  Document result = 1;
}

// ==================== Analytics ====================

message GetAnalyticsRequest {
  int64 window_seconds = 1;
}

message GetAnalyticsResponse {
  int64 total_operations = 1;
  int64 total_errors = 2;
  double error_rate = 3;
  double p50_latency_ms = 4;
  double p95_latency_ms = 5;
  double p99_latency_ms = 6;
  repeated OperationCount top_operations = 7;
  repeated CollectionCount top_collections = 8;
}

message OperationCount {
  string operation = 1;
  int64 count = 2;
}

message CollectionCount {
  string collection = 1;
  int64 count = 2;
}

// --- Pipeline ---

message PipelineRequest {
  repeated PipelineOperation operations = 1;
}

message PipelineOperation {
  oneof operation {
    FindRequest find = 1;
    FindOneRequest find_one = 2;
    InsertRequest insert = 3;
    InsertManyRequest insert_many = 4;
    UpdateRequest update = 5;
    UpdateManyRequest update_many = 6;
    DeleteRequest delete = 7;
    DeleteManyRequest delete_many = 8;
    AggregateRequest aggregate = 9;
    FindAndModifyRequest find_and_modify = 10;
    RunCommandRequest run_command = 11;
    SearchRequest search = 12;
    CreateCollectionRequest create_collection = 13;
    CreateIndexRequest create_index = 14;
    ListDatabasesRequest list_databases = 15;
    ListCollectionsRequest list_collections = 16;
    BeginTransactionRequest begin_transaction = 17;
    CommitTransactionRequest commit_transaction = 18;
    AbortTransactionRequest abort_transaction = 19;
    GetAnalyticsRequest get_analytics = 20;
  }
}

message PipelineResponse {
  repeated PipelineResult results = 1;
  uint32 succeeded = 2;
  uint32 failed = 3;
}

message PipelineResult {
  uint32 index = 1;
  oneof result {
    FindResponse find = 2;
    FindOneResponse find_one = 3;
    InsertResponse insert = 4;
    InsertManyResponse insert_many = 5;
    UpdateResponse update = 6;
    UpdateManyResponse update_many = 7;
    DeleteResponse delete = 8;
    DeleteManyResponse delete_many = 9;
    AggregateResponse aggregate = 10;
    FindAndModifyResponse find_and_modify = 11;
    RunCommandResponse run_command = 12;
    SearchResponse search = 13;
    CreateCollectionResponse create_collection = 14;
    CreateIndexResponse create_index = 15;
    ListDatabasesResponse list_databases = 16;
    ListCollectionsResponse list_collections = 17;
    BeginTransactionResponse begin_transaction = 18;
    CommitTransactionResponse commit_transaction = 19;
    AbortTransactionResponse abort_transaction = 20;
    GetAnalyticsResponse get_analytics = 21;
    PipelineError error = 22;
  }
}

message PipelineError {
  int32 code = 1;
  string message = 2;
}

// --- Transaction Pipeline ---

message TransactionStep {
  string name = 1;
  string database = 2;
  string collection = 3;
  oneof operation {
    FindOneRequest find_one = 10;
    FindRequest find = 11;
    InsertRequest insert = 12;
    InsertManyRequest insert_many = 13;
    UpdateRequest update = 14;
    UpdateManyRequest update_many = 15;
    DeleteRequest delete = 16;
    DeleteManyRequest delete_many = 17;
    FindAndModifyRequest find_and_modify = 18;
    AggregateRequest aggregate = 19;
  }
}

message TransactionPipelineOptions {
  optional string read_concern = 1;
  optional string write_concern = 2;
  optional uint64 max_time_ms = 3;
}

message TransactionPipelineRequest {
  repeated TransactionStep steps = 1;
  optional TransactionPipelineOptions options = 2;
}

message TransactionStepResult {
  string name = 1;
  bool success = 2;
  oneof result {
    FindResponse find_result = 10;
    FindOneResponse find_one_result = 11;
    InsertResponse insert_result = 12;
    InsertManyResponse insert_many_result = 13;
    UpdateResponse update_result = 14;
    DeleteResponse delete_result = 15;
    DeleteManyResponse delete_many_result = 16;
    AggregateResponse aggregate_result = 17;
    FindAndModifyResponse find_and_modify_result = 18;
  }
}

message TransactionPipelineSummary {
  uint32 total_steps = 1;
  uint32 steps_completed = 2;
  uint64 elapsed_ms = 3;
}

message TransactionPipelineResponse {
  repeated TransactionStepResult steps = 1;
  TransactionPipelineSummary summary = 2;
}

message TransactionPipelineError {
  string failed_step = 1;
  uint32 step_index = 2;
  string reason = 3;
  repeated string steps_completed = 4;
  bool rolled_back = 5;
}
