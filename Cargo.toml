[package]
name = "mongocore"
version = "0.1.0"
edition = "2021"
description = "AI-native MongoDB driver sidecar"
license = "Apache-2.0"

[dependencies]
mongodb = "3"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
bson = { version = "2", features = ["serde_with"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
prost = "0.13"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"
axum = "0.8"
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
http-body-util = "0.1"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json"] }
