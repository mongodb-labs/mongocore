[package]
name = "mongocore"
version = "0.1.0"
edition = "2021"
description = "AI-native MongoDB driver sidecar"
license = "Apache-2.0"

[dependencies]
mongodb = "3"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
bson = { version = "2", features = ["serde_with"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3"
