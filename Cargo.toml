[package]
name = "mongocore"
version = "0.1.0"
edition = "2021"
description = "AI-native MongoDB driver sidecar"
license = "Apache-2.0"

[dependencies]
mongodb = { version = "3", features = ["tracing-unstable"] }
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
bson = { version = "2", features = ["serde_with"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
prost = "0.13"
regex = "1"
sha2 = "0.10"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"
axum = "0.8"
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
http-body-util = "0.1"
http = "1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
async-stream = "0.3"
futures = "0.3"
polars = { version = "0.46", features = ["lazy", "csv", "json", "parquet", "dtype-struct", "cloud"] }
notify = { version = "7", features = ["macos_fsevent"] }
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
opentelemetry = { version = "0.28", optional = true }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.28", features = ["grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.29", optional = true }

[features]
default = []
otel = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "tracing-opentelemetry"]

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
bson = { version = "2", features = ["serde_with"] }
