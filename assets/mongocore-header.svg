<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MongoCore">
<title>MongoCore</title>
<desc>MongoCore logo: pointed green leaf with a Rust-orange hexagonal core, wordmark, tagline, and feature pills.</desc>

<defs>
<linearGradient id="leafG" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#4DB33D"/>
<stop offset="100%" stop-color="#2E7D32"/>
</linearGradient>
<linearGradient id="rustG" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#D97706"/>
<stop offset="100%" stop-color="#A04500"/>
</linearGradient>
<clipPath id="leafClip">
<path d="M120 40 C 190 110, 210 180, 210 220 C 210 270, 170 305, 120 320 C 70 305, 30 270, 30 220 C 30 180, 50 110, 120 40 Z"/>
</clipPath>
</defs>

<path d="M120 40 C 190 110, 210 180, 210 220 C 210 270, 170 305, 120 320 C 70 305, 30 270, 30 220 C 30 180, 50 110, 120 40 Z" fill="url(#leafG)"/>
