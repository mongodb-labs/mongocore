</g>
<polygon points="60,0 30,51.96 -30,51.96 -60,0 -30,-51.96 30,-51.96" fill="url(#rustG)" stroke="#5A2600" stroke-width="2"/>
<polygon points="40,0 20,34.64 -20,34.64 -40,0 -20,-34.64 20,-34.64" fill="none" stroke="#FDE68A" stroke-width="2" opacity="0.85"/>
