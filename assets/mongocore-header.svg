<circle cx="-30" cy="-51.96" r="4" fill="#FDE68A"/>
<circle cx="30" cy="-51.96" r="4" fill="#FDE68A"/>
<g stroke="#FDE68A" stroke-width="1.5" opacity="0.55">
<line x1="0" y1="0" x2="60" y2="0"/>
<line x1="0" y1="0" x2="30" y2="51.96"/>
