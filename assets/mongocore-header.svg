<line x1="270" y1="100" x2="270" y2="240" stroke="#CBD5E1" stroke-width="1"/>

<text x="310" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="92" font-weight="500" letter-spacing="-2">
<tspan fill="#2E7D32">Mongo</tspan><tspan fill="#A04500">Core</tspan>
</text>

