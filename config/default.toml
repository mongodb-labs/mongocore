# MongoCore default configuration
# Override with environment variables (MONGOCORE_*) or CLI flags

# MongoDB connection URI
connection_uri = "mongodb://localhost:27017"

# gRPC server port (for application clients)
grpc_port = 50051

# MCP server port (for AI agents)
mcp_port = 3000

# LLM provider for compiled queries (optional)
# Options: "claude", "openai"
# llm_provider = "claude"

# Environment variable containing the LLM API key
# llm_api_key_env = "ANTHROPIC_API_KEY"

# Environment variable containing the Voyage AI API key
# voyage_api_key_env = "VOYAGE_API_KEY"

# Whether to sync compiled query cache to Atlas
compiled_cache_sync = true

# Log level: trace, debug, info, warn, error
log_level = "info"

# Transport mode: "both" (default), "tcp", "uds"
transport = "both"

# Unix domain socket path (used when transport includes UDS)
socket_path = "/tmp/mongocore.sock"

# Maximum gRPC message size in bytes (default: 64MB)
# grpc_max_message_size = 67108864

# gRPC compression: "none" (default), "gzip", "zstd"
# grpc_compression = "none"

# Streaming batch size (documents per frame, default: 1000)
# stream_batch_size = 1000

# Stream idle timeout in seconds (default: 60)
# stream_idle_timeout_secs = 60
